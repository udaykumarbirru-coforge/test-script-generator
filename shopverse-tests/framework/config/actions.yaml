schema_version: "1.0"
library: PlaywrightActions
implementation: framework/core/actions.py
description: "Framework action catalog generated from the supplied browser, element, get, and keyboard keyword sources."
keywords:
  # Browser (7)
  open_url: {category: browser, description: "Opens a URL and waits for DOM content loaded.", requires_locator: false, requires_value: true, healer_eligible: false}
  refresh: {category: browser, description: "Reloads the current page and waits for DOM content loaded.", requires_locator: false, requires_value: false, healer_eligible: false}
  navigate_back: {category: browser, description: "Navigates to the previous browser history entry.", requires_locator: false, requires_value: false, healer_eligible: false}
  navigate_forward: {category: browser, description: "Navigates to the next browser history entry.", requires_locator: false, requires_value: false, healer_eligible: false}
  switch_tab: {category: browser, description: "Switches to a browser tab by zero-based index and returns the active Page.", requires_locator: false, requires_value: true, healer_eligible: false}
  close_tab: {category: browser, description: "Closes the active tab and switches to the last remaining tab when available.", requires_locator: false, requires_value: false, healer_eligible: false}
  maximize: {category: browser, description: "Attempts to maximize the current browser window using browser-side window APIs.", requires_locator: false, requires_value: false, healer_eligible: false}

  # Element (20)
  click: {category: element, description: "Clicks an element.", requires_locator: true, requires_value: false, healer_eligible: true}
  input_text: {category: element, description: "Enters text into an editable element, optionally clearing its existing value first.", requires_locator: true, requires_value: true, healer_eligible: true}
  select_date: {category: element, description: "Enters a date value into a date-capable input and commits it with Tab.", requires_locator: true, requires_value: true, healer_eligible: true}
  double_click: {category: element, description: "Double-clicks an element.", requires_locator: true, requires_value: false, healer_eligible: true}
  right_click: {category: element, description: "Performs a right/context click on an element.", requires_locator: true, requires_value: false, healer_eligible: true}
  mouse_hover: {category: element, description: "Moves the pointer over an element.", requires_locator: true, requires_value: false, healer_eligible: true}
  scroll_to_element: {category: element, description: "Scrolls an element into the viewport.", requires_locator: true, requires_value: false, healer_eligible: true}
  clear_text: {category: element, description: "Clears the value of an editable element.", requires_locator: true, requires_value: false, healer_eligible: true}
  append_text: {category: element, description: "Appends text to the current value using sequential key input.", requires_locator: true, requires_value: true, healer_eligible: true}
  send_keys: {category: element, description: "Sends a Playwright-compatible key or key combination to an element.", requires_locator: true, requires_value: true, healer_eligible: true}
  select_option: {category: element, description: "Selects a checkbox, radio, native select option, combobox option, or accessible custom dropdown option.", requires_locator: true, requires_value: true, healer_eligible: true}
  unselect_option: {category: element, description: "Unchecks a checkbox or removes a matching selection from a native select element.", requires_locator: true, requires_value: false, healer_eligible: true}
  toggle_switch: {category: element, description: "Changes a checkbox or ARIA switch to the requested on/off state.", requires_locator: true, requires_value: true, healer_eligible: true}
  search_and_select_autocomplete: {category: element, description: "Types into an autocomplete control and selects a suggestion using ArrowDown and Enter.", requires_locator: true, requires_value: true, healer_eligible: true}
  close_dialog: {category: element, description: "Closes a dialog using a supplied close locator, accessible close buttons, or Escape fallback.", requires_locator: false, requires_value: false, healer_eligible: true}
  upload_file: {category: element, description: "Uploads a file through a file input or file chooser.", requires_locator: true, requires_value: true, healer_eligible: true}
  drag_start: {category: element, description: "Starts a mouse drag from the center of an element.", requires_locator: true, requires_value: false, healer_eligible: true}
  drag_move_to: {category: element, description: "Moves an active mouse drag to the center of a target element.", requires_locator: true, requires_value: false, healer_eligible: true}
  drag_end: {category: element, description: "Ends the active mouse drag by releasing the mouse button.", requires_locator: false, requires_value: false, healer_eligible: false}
  wait_time: {category: element, description: "Waits for the requested number of seconds; intended only for explicit manual wait steps.", requires_locator: false, requires_value: true, healer_eligible: false}

  # Get (1)
  get_text: {category: get, description: "Returns the text content of an element as a string.", requires_locator: true, requires_value: false, healer_eligible: true}

  # Keyboard (30)
  key_enter: {category: keyboard, description: "Presses Enter.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_escape: {category: keyboard, description: "Presses Escape.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_tab: {category: keyboard, description: "Presses Tab.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_backspace: {category: keyboard, description: "Presses Backspace.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_delete: {category: keyboard, description: "Presses Delete.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_space: {category: keyboard, description: "Presses Space.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_arrow_up: {category: keyboard, description: "Presses ArrowUp.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_arrow_down: {category: keyboard, description: "Presses ArrowDown.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_arrow_left: {category: keyboard, description: "Presses ArrowLeft.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_arrow_right: {category: keyboard, description: "Presses ArrowRight.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_home: {category: keyboard, description: "Presses Home.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_end: {category: keyboard, description: "Presses End.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_page_up: {category: keyboard, description: "Presses PageUp.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_page_down: {category: keyboard, description: "Presses PageDown.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_f1: {category: keyboard, description: "Presses F1.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_f5: {category: keyboard, description: "Presses F5.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_f12: {category: keyboard, description: "Presses F12.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_ctrl_c: {category: keyboard, description: "Presses Control+C.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_ctrl_v: {category: keyboard, description: "Presses Control+V.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_ctrl_x: {category: keyboard, description: "Presses Control+X.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_ctrl_a: {category: keyboard, description: "Presses Control+A.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_ctrl_z: {category: keyboard, description: "Presses Control+Z.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_ctrl_y: {category: keyboard, description: "Presses Control+Y.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_ctrl_s: {category: keyboard, description: "Presses Control+S.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_ctrl_p: {category: keyboard, description: "Presses Control+P.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_alt_tab: {category: keyboard, description: "Presses Alt+Tab.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_shift_tab: {category: keyboard, description: "Presses Shift+Tab.", requires_locator: false, requires_value: false, healer_eligible: false}
  key_ctrl_shift_tab: {category: keyboard, description: "Presses Control+Shift+Tab.", requires_locator: false, requires_value: false, healer_eligible: false}
  type_text: {category: keyboard, description: "Types text using the page keyboard.", requires_locator: false, requires_value: true, healer_eligible: false}
  press_key: {category: keyboard, description: "Presses any Playwright-compatible key or key combination.", requires_locator: false, requires_value: true, healer_eligible: false}
